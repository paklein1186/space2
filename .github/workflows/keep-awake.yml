name: Garder Space2 éveillé

# Streamlit Community Cloud (palier gratuit) met l'app en veille après une
# période d'inactivité — la visite suivante affiche alors "Your app is
# waking up!" le temps d'un redémarrage à froid. Ce ping régulier simule une
# visite pour que l'app ne retombe jamais en veille.
#
# Ne résout que le délai de réveil à froid, pas la lenteur de calcul en
# fonctionnement normal (ressources mutualisées du palier gratuit) — pour
# ça, voir les options d'hébergement alternatif évoquées en conversation.
#
# Espacé à toutes les 6h (plutôt que 20 min à l'origine) : Streamlit ne met
# l'app en veille qu'après 12h D'INACTIVITÉ, donc 6h garde une marge de
# sécurité x2 tout en divisant le nombre de pings/jour par ~18 (72 -> 4).
# Chaque ping déclenche un vrai rechargement de la page d'accueil, qui lit
# ~4000 lieux + leurs synthèses depuis Supabase (donnees_annuaire(),
# src/donnees_observatoire.py) — à 20 min d'intervalle, le cache (TTL 2 min)
# était systématiquement expiré à chaque ping, donc CHAQUE ping relisait
# toute la base. Mesuré en direct : Egress Supabase passé de 7,29 à 12,29 Go
# en 5 jours (quota gratuit : 5 Go), uniquement entre deux visites humaines
# quasi nulles (2 MAU) — ce ping, pas le trafic réel, en était la cause.
#
# GitHub désactive automatiquement un workflow planifié après 60 jours sans
# la moindre activité sur le dépôt (commit/push) — sans rapport avec ce que
# fait ce workflow lui-même, juste une limite de GitHub Actions à garder en
# tête si le dépôt venait à rester longtemps inactif.

on:
  schedule:
    - cron: "0 */6 * * *"  # toutes les 6 heures
  workflow_dispatch: {}  # déclenchement manuel depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visiter Space2
        run: curl -fsS --max-time 30 "https://space2.streamlit.app/" -o /dev/null
