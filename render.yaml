# Blueprint Render pour l'API Space2 (ctg). Render > New > Blueprint > ce dépôt.
# Les valeurs "sync: false" sont à saisir dans le tableau de bord Render
# (jamais dans le dépôt).
services:
  - type: web
    name: space2-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CTG_WEBHOOK_SECRET
        sync: false
      # Clé de lecture seule du site troistiers.space (GET /lieux uniquement).
      - key: SITE_READ_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: ASK_MODEL
        value: claude-sonnet-5
      - key: CTG_ASK_FULL_ACCESS
        value: "true"
      # Agent des questions venues du site Trois-Tiers : public (false, défaut) ou complet hors confidentiel (true).
      - key: SITE_ASK_FULL_ACCESS
        value: "false"
      # Connexion unique depuis troistiers.space : Auth de ChangeTheGame, pour vérifier le jeton
      # de la personne (POST /sso/ticket). La clé anon de ChangeTheGame est publique.
      - key: CTG_SUPABASE_URL
        value: https://anzeimppqytonfxrnqxp.supabase.co
      - key: CTG_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
